<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All-My-App | Ma Bibliothèque d'Applications</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        header {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.05em;
        }

        header p {
            margin: 10px 0 0 0;
            opacity: 0.8;
            font-size: 1.1rem;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* Barre d'état de chargement */
        #loader-zone {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            font-weight: 600;
            color: var(--primary);
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(79, 70, 229, 0.2);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 20px 0 15px 0;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .breadcrumb span.active {
            color: var(--primary);
        }

        .breadcrumb .separator {
            color: #cbd5e1;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #e2e8f0;
            color: var(--text-main);
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 15px;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background: #cbd5e1;
        }

        .explorer {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
        }

        .explorer-header {
            display: grid;
            grid-template-columns: 1fr auto;
            padding: 15px 24px;
            background: #f1f5f9;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .file-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .file-item {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            padding: 14px 24px;
            border-bottom: 1px solid var(--border);
            transition: background 0.2s;
        }

        .file-item:last-child {
            border-bottom: none;
        }

        .file-item:hover {
            background-color: #f8fafc;
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            user-select: none;
        }

        .file-info i {
            font-size: 1.3rem;
            width: 24px;
            text-align: center;
        }

        .file-info i.fa-folder { color: #f59e0b; }
        .file-info i.fa-android { color: #a4c639; }
        .file-info i.fa-file { color: #64748b; }

        .file-name {
            font-weight: 500;
            color: var(--text-main);
        }

        .btn-download {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .btn-download:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>

<header>
    <h1>All-My-App</h1>
    <p>Magasin d'applications personnel & Explorateur de fichiers</p>
</header>

<div class="container">
    <div id="loader-zone">
        <div class="spinner"></div> <span id="loader-text">Chargement et décompression automatique des applications...</span>
    </div>

    <div id="explorer-section" style="display: none;">
        <div class="breadcrumb" id="breadcrumb">
            <span class="active">Racine</span>
        </div>
        
        <button class="back-btn" id="back-btn" style="display: none;">
            <i class="fa-solid fa-arrow-left"></i> Retour
        </button>

        <div class="explorer">
            <div class="explorer-header">
                <div>Nom</div>
                <div>Action</div>
            </div>
            <ul class="file-list" id="file-list">
                </ul>
        </div>
    </div>
</div>

<script>
    // Liste de tes fichiers ZIP sur GitHub
    const zipFiles = [
        "livesplit.zip",
        "multi-game.zip",
        "Mytube.zip",
        "pvz multi.zip",
        "steamvault.zip"
    ];

    let currentPath = ""; 
    let virtualTree = { files: {}, dirs: {} };

    const loaderZone = document.getElementById('loader-zone');
    const loaderText = document.getElementById('loader-text');
    const explorerSection = document.getElementById('explorer-section');
    const fileListEl = document.getElementById('file-list');
    const backBtn = document.getElementById('back-btn');
    const breadcrumbEl = document.getElementById('breadcrumb');

    // Lancement automatique au chargement de la page
    window.addEventListener('DOMContentLoaded', async () => {
        try {
            for (let i = 0; i < zipFiles.length; i++) {
                const zipName = zipFiles[i];
                loaderText.innerText = `Téléchargement et analyse de ${zipName} (${i+1}/${zipFiles.length})...`;
                
                // Récupération du fichier ZIP depuis ton GitHub
                const response = await fetch(zipName);
                if (!response.ok) throw new Error(`Impossible de récupérer ${zipName}`);
                
                const blob = await response.blob();
                const zip = await JSZip.loadAsync(blob);
                
                // Injection dans l'arborescence globale
                buildVirtualTree(zip);
            }

            // Fin du chargement
            loaderZone.style.display = "none";
            explorerSection.style.display = "block";
            renderCurrentDirectory();

        } catch (error) {
            loaderZone.style.background = "#fee2e2";
            loaderZone.style.color = "#991b1b";
            loaderText.innerText = "Erreur lors du dézippage automatique : " + error.message;
            console.error(error);
        }
    });

    // Fusionne le contenu des ZIP dans un arbre unique de dossiers
    function buildVirtualTree(zip) {
        zip.forEach(function(relativePath, zipEntry) {
            const cleanPath = relativePath.replace(/\/$/, "");
            if(!cleanPath) return;

            const parts = cleanPath.split('/');
            let current = virtualTree;

            for (let i = 0; i < parts.length; i++) {
                const part = parts[i];
                const isLast = (i === parts.length - 1);

                if (isLast && !zipEntry.dir) {
                    current.files[part] = zipEntry;
                } else {
                    if (!current.dirs[part]) {
                        current.dirs[part] = { files: {}, dirs: {} };
                    }
                    current = current.dirs[part];
                }
            }
        });
    }

    // Affiche le dossier courant
    function renderCurrentDirectory() {
        fileListEl.innerHTML = '';
        
        let parts = currentPath.split('/').filter(p => p !== "");
        let node = virtualTree;
        for (let part of parts) {
            if (node.dirs[part]) node = node.dirs[part];
        }

        if (currentPath !== "") {
            backBtn.style.display = "inline-flex";
        } else {
            backBtn.style.display = "none";
        }

        updateBreadcrumb(parts);

        // Dossiers
        for (let dirName in node.dirs) {
            const li = document.createElement('li');
            li.className = 'file-item';
            li.innerHTML = `
                <div class="file-info">
                    <i class="fa-solid fa-folder"></i>
                    <span class="file-name">${dirName}</span>
                </div>
                <div></div>
            `;
            li.querySelector('.file-info').addEventListener('click', () => {
                currentPath = currentPath ? `${currentPath}/${dirName}` : dirName;
                renderCurrentDirectory();
            });
            fileListEl.appendChild(li);
        }

        // Fichiers
        for (let fileName in node.files) {
            const zipEntry = node.files[fileName];
            const li = document.createElement('li');
            li.className = 'file-item';

            let iconClass = "fa-solid fa-file";
            if (fileName.toLowerCase().endsWith('.apk')) {
                iconClass = "fa-brands fa-android";
            }

            li.innerHTML = `
                <div class="file-info">
                    <i class="${iconClass}"></i>
                    <span class="file-name">${fileName}</span>
                </div>
                <div>
                    <button class="btn-download"><i class="fa-solid fa-download"></i> Télécharger</button>
                </div>
            `;

            li.querySelector('.btn-download').addEventListener('click', () => {
                // Change temporairement le bouton en chargement
                const btn = li.querySelector('.btn-download');
                const originalText = btn.innerHTML;
                btn.innerHTML = `<div class="spinner" style="border-top-color:white; width:12px; height:12px; margin-right:5px;"></div> Extraction...`;
                btn.disabled = true;

                zipEntry.async('blob').then(function(content) {
                    const url = window.URL.createObjectURL(content);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = fileName;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                    
                    // Remet le bouton à l'état normal
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                });
            });

            fileListEl.appendChild(li);
        }

        if (fileListEl.children.length === 0) {
            fileListEl.innerHTML = `<li class="file-item" style="color: var(--text-muted); padding: 20px;">Dossier vide</li>`;
        }
    }

    backBtn.addEventListener('click', () => {
        let parts = currentPath.split('/').filter(p => p !== "");
        parts.pop();
        currentPath = parts.join('/');
        renderCurrentDirectory();
    });

    function updateBreadcrumb(parts) {
        breadcrumbEl.innerHTML = '<span style="cursor:pointer" id="crumb-root">Racine</span>';
        document.getElementById('crumb-root').addEventListener('click', () => {
            currentPath = "";
            renderCurrentDirectory();
        });

        let pathAccumulator = "";
        parts.forEach((part, index) => {
            pathAccumulator = pathAccumulator ? `${pathAccumulator}/${part}` : part;
            const currentSnap = pathAccumulator;

            const sep = document.createElement('span');
            sep.className = 'separator';
            sep.innerText = ' / ';
            breadcrumbEl.appendChild(sep);

            const span = document.createElement('span');
            if (index === parts.length - 1) {
                span.className = 'active';
                span.innerText = part;
            } else {
                span.innerText = part;
                span.style.cursor = "pointer";
                span.addEventListener('click', () => {
                    currentPath = currentSnap;
                    renderCurrentDirectory();
                });
            }
            breadcrumbEl.appendChild(span);
        });
    }
</script>

</body>
</html>
